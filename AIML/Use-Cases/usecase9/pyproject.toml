[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corrective-rag-observability"
version = "0.1.0"
description = "Use Case 3 Corrective RAG chatbot with Use Case 9 observability and evaluation pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pytest>=8.0",
  "streamlit>=1.35",
  "pypdf>=4.0",
]

[project.optional-dependencies]
observability = [
  "langfuse==4.*",
  "langchain-core>=0.2",
]
chroma = [
  "chromadb>=0.5",
]
ragas = [
  "ragas==0.4.3",
  "datasets>=2.19",
  "pandas>=2.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
all = [
  "langfuse==4.*",
  "langchain-core>=0.2",
  "chromadb>=0.5",
  "ragas==0.4.3",
  "datasets>=2.19",
  "pandas>=2.0",
  "ruff>=0.5",
]

[project.scripts]
corrective-rag = "corrective_rag.cli:main"
seed-langfuse-dataset = "corrective_rag.seed_langfuse:main"
rag-eval-report = "corrective_rag.report:main"
export-approved-conversations = "datasets.exporter:main"
compare-rag-baseline = "experiments.baseline:main"
langfuse-healthcheck = "corrective_rag.langfuse_healthcheck:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
